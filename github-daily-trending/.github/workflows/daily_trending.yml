name: Auto Daily GitHub Trending

on:
  schedule:
    # 每天北京时间早上 8:30 自动触发 (国际标准时 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # 允许你随时在 GitHub 网页上点击按钮手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 执行爬虫脚本
      run: python main.py

    - name: 5. 将更新后的 README 提交回 GitHub 仓库
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add README.md
        # 检查是否有内容修改，防止没有更新时报错中断
        git diff-index --quiet HEAD || git commit -m "📝 Auto Update: GitHub Trending ($(date +'%Y-%m-%d'))"
        git push.
