name: Auto Daily GitHub Trending

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 执行爬虫脚本
      run: python main.py

    - name: 5. 将更新后的 README 提交回 GitHub 仓库
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add README.md
        git diff-index --quiet HEAD || git commit -m "📝 Auto Update: GitHub Trending ($(date +'%Y-%m-%d'))"
        git push
